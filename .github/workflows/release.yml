name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build plugin zip
        run: |
          mkdir -p release/dsh-whale-widget-dual
          rsync -a --exclude '.git' --exclude '.github' --exclude 'dist' --exclude 'release' ./ release/dsh-whale-widget-dual/
          cd release && zip -r "../dsh-whale-widget-dual-${GITHUB_REF_NAME#v}.zip" dsh-whale-widget-dual
      - uses: softprops/action-gh-release@v2
        with:
          files: dsh-whale-widget-dual-*.zip
          generate_release_notes: true
